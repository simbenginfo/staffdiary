[build]
  publish = "dist"
  command = "npm run build"

# Never cache index.html or root pages so users always get fresh updates immediately
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache immutable hashed assets generated by Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
